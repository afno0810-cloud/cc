        <div class="prose" data-reveal>
          <p>Marinor NTNU is a technical student organisation at NTNU. We build autonomous boats that find their way on the water without anyone steering.</p>
          <p>Our members study robotics, automation, marine technology and other subjects. We work with the Department of Engineering Cybernetics.</p>
          <p>Marinor was founded in 2025 and has more than 35 members.</p>

    <section class="sec split">

        </div>
        <div class="prose" data-reveal>
          <p>Argus is our first autonomous surface vessel. It finds its way on the water with no one at the wheel.</p>

  <!-- ============ What is on board (3D, the list drives the model) ============ -->
  <section class="sec" id="on-board">
    <div class="wrap">
      <div class="sec-head" data-reveal>
        <p class="eyebrow">On board</p>
        <h2 class="h2">What is on board</h2>
        <p class="lead">The sensors and hardware Argus uses to see, find its position and steer.</p>
      </div>
    </div>
    <div class="stage onboard" data-stage="argus" data-mode="list" data-offset="-0.27" data-parts="hull,props,gnss,camera,lidar,pixhawk,link,case">
      <div class="wrap onboard-grid">
        <div class="stage-sticky onboard-view" aria-hidden="true">
      <div class="win-box" aria-hidden="true"></div>
        </div>
        <div class="onboard-list">
          <figure class="media grade hud onboard-photo">
            <img src="media/img/argus-argus-sensors-closeup-dscf6178-1600.webp" srcset="media/img/argus-argus-sensors-closeup-dscf6178-800.webp 800w, media/img/argus-argus-sensors-closeup-dscf6178-1600.webp 1600w, media/img/argus-argus-sensors-closeup-dscf6178-2400.webp 2400w" sizes="(max-width: 1100px) 100vw, 44vw" alt="Sensors mounted on the electronics case" width="7728" height="5152" loading="lazy" decoding="async">
            <span class="tag onboard-tag"><i class="dot dot-live"></i>Sensing</span>
            <figcaption class="collage-chip onboard-cap"><i class="dot" style="background:var(--violet)"></i>Sensors mounted on top of the electronics case</figcaption>
          </figure>
          <ol class="rows">
            <li class="row" data-part="hull"><span class="row-no">01</span><h3 class="row-title is-sans">Two hulls</h3><p>Argus is a catamaran. The two hulls give a wide and stable platform for the sensors and electronics.</p></li>
            <li class="row" data-part="props"><span class="row-no">02</span><h3 class="row-title is-sans">Four propellers</h3><p>With four propellers Argus can turn a full 360 degrees while it keeps moving forward.</p></li>
            <li class="row" data-part="gnss"><span class="row-no">03</span><h3 class="row-title is-sans">Kongsberg Seapath 130</h3><p>A GNSS-aided inertial navigation system. It combines multi-frequency GNSS receivers with gyroscopes and accelerometers, and gives Argus its position, heading, speed, roll and pitch.</p></li>
            <li class="row" data-part="camera"><span class="row-no">04</span><h3 class="row-title is-sans">Stereo depth camera</h3><p>Two lenses measure the distance to things in front of the boat. The images are also used to recognise what the objects are.</p></li>
            <li class="row" data-part="lidar"><span class="row-no">05</span><h3 class="row-title is-sans">LiDAR</h3><p>Measures the distance to docks, buoys, boats and other obstacles around the boat.</p></li>
            <li class="row" data-part="pixhawk"><span class="row-no">06</span><h3 class="row-title is-sans">Pixhawk flight controller</h3><p>Controls the motors. It calculates the PWM signal that sets the speed of each propeller.</p></li>
            <li class="row" data-part="link"><span class="row-no">07</span><h3 class="row-title is-sans">5G link</h3><p>Sends all data from the boat to land, so we can follow its internal state while it sails.</p></li>
            <li class="row" data-part="case"><span class="row-no">08</span><h3 class="row-title is-sans">Waterproof electronics case</h3><p>The computer, power and wiring are kept dry inside one sealed case.</p></li>
          </ol>
        </div>
      </div>
      <div class="stage-labels" data-labels></div>
    </div>
  </section>

  <div class="wrap">
    <!-- ============ How Argus finds its way ============ -->
    <section class="sec" id="autonomy">
      <div class="panel autonomy contours">
        <div class="sec-head" data-reveal>
          <p class="eyebrow">Autonomy</p>
          <h2 class="h2">How Argus finds its way</h2>
          <p class="lead">From what the sensors see to the signal that turns the propellers, in the order it happens on board.</p>
        </div>
        <ol class="chain sec-body" data-reveal>
          <li class="chain-step" style="--k:0"><p class="chain-top"><span>01</span><span>See</span></p><h3 class="h3">Stereo camera and LiDAR</h3><p class="small">The depth camera measures distance and recognises objects like buoys and boats. The LiDAR measures the distance to everything around the boat.</p></li>
          <li class="chain-step" style="--k:1"><p class="chain-top"><span>02</span><span>Locate</span></p><h3 class="h3">Kongsberg Seapath 130</h3><p class="small">GNSS receivers give the position and heading. Gyroscopes and accelerometers fill in between the satellite fixes and keep the estimate going if the signal drops out. Correction data over 5G makes the position more accurate.</p><a class="link-arrow" href="https://www.kongsberg.com/what-we-do/ocean-space/inertial-solutions/seapath/seapath-130-series/" target="_blank" rel="noopener noreferrer">Seapath 130 at Kongsberg<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M7 17 17 7M9 7h8v8"/></svg></a></li>
          <li class="chain-step" style="--k:2"><p class="chain-top"><span>03</span><span>Map</span></p><h3 class="h3">Cost map</h3><p class="small">What the sensors find goes into a map of the water around the boat. Obstacles, and the water close to them, cost more to sail through.</p></li>
          <li class="chain-step" style="--k:3"><p class="chain-top"><span>04</span><span>Decide</span></p><h3 class="h3">State machine</h3><p class="small">Keeps track of what Argus is doing right now, for example following the course, going around another boat or docking, and switches when something changes.</p></li>
          <li class="chain-step" style="--k:4"><p class="chain-top"><span>05</span><span>Plan</span></p><h3 class="h3">Field D*</h3><p class="small">The path planning algorithm finds the cheapest route across the cost map, and plans again when the map changes.</p></li>
          <li class="chain-step" style="--k:5"><p class="chain-top"><span>06</span><span>Drive</span></p><h3 class="h3">Pixhawk</h3><p class="small">The flight controller turns the plan into PWM signals for the four motors.</p></li>
        </ol>
        <div class="link5g" data-reveal="self">
          <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <b>5G to shore</b>
          <p class="small">All data from Argus is sent to land over 5G, so we can follow its internal state and get important information while it sails.</p>
        </div>
      </div>
    </section>

<main id="main">
  <div class="wrap">
    <!-- ============ Hero ============ -->
    <section class="hero-card comp-hero" aria-label="The Njord Challenge">
      <div class="media grade"><img src="media/img/competitions-njord-all-teams-at-haven-1600.webp" srcset="media/img/competitions-njord-all-teams-at-haven-800.webp 800w, media/img/competitions-njord-all-teams-at-haven-1600.webp 1600w, media/img/competitions-njord-all-teams-at-haven-2400.webp 2400w" sizes="100vw" alt="Teams at the Njord Challenge in Trondheim" width="2476" height="1234" loading="eager" fetchpriority="high" decoding="async"></div>
      <div class="hero-card-top">
        <p class="eyebrow rise">Competitions · Njord</p>
      </div>
      
      <div class="hero-card-body">
        <h1 class="h1 comp-title"><span class="line-mask"><span style="--d:.1s">The Njord Challenge</span></span></h1>
        <p class="lead rise" style="--d:.3s">A student competition for autonomous boats, held every August in Trondheim. Teams from several countries bring boats they have built and let them sail on their own.</p>
        <ul class="chips rise" style="--d:.35s"><li class="tag">Nyhavna, Trondheim</li><li class="tag">Five days in August</li><li class="tag">Student teams from many countries</li></ul>
        <div class="btns rise" style="--d:.4s">
          <a class="btn btn-light is-out" href="https://www.njordchallenge.com" target="_blank" rel="noopener noreferrer"><span>Njord's website</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M7 17 17 7M9 7h8v8"/></svg></a>
          <a class="btn btn-line" href="#page-projects-argus"><span>Meet Argus</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M4 12h15M13 6l6 6-6 6"/></svg></a>
        </div>
      </div>
    </section>

    <!-- ============ Numbers ============ -->
    <section class="sec-tight">
      <div class="stats" data-reveal><div class="stat"><b>4</b><span>tasks on the water: manoeuvring, path finding, collision avoidance and docking</span></div><div class="stat"><b>5<small> days</small></b><span>of competition in Nyhavna, Trondheim</span></div><div class="stat"><b>2019</b><span>the year Njord was started by students at NTNU</span></div><div class="stat"><b>23</b><span>teams signed up for the 2026 challenge, Marinor among them</span></div></div>
    </section>

    <!-- ============ What it is ============ -->
    <section class="sec split">
      <div>
        <div class="sec-head" data-reveal>
          <p class="eyebrow">What it is</p>
          <h2 class="h2">What Njord is.</h2>
        </div>
        <div class="prose" data-reveal><p>Njord: The Autonomous Ship Challenge is run by Njord NTNU, a student organisation started in Trondheim in 2019. Every August student teams come to Nyhavna in Trondheim.</p><p>Each team builds and runs its own autonomous boat. During the week the boats solve tasks on the water with no one steering. In 2025 eleven teams from eight countries took part, and Navier USN from Norway won.</p></div>
      </div>
      <div class="collage" data-reveal="self">
        <div class="media grade c-a hud"><img src="media/img/argus-dock-lowering-argus-dscf6206-1600.webp" srcset="media/img/argus-dock-lowering-argus-dscf6206-800.webp 800w, media/img/argus-dock-lowering-argus-dscf6206-1600.webp 1600w, media/img/argus-dock-lowering-argus-dscf6206-2400.webp 2400w" sizes="(max-width: 860px) 90vw, 44vw" alt="Argus being lowered into the water" width="7728" height="5152" loading="lazy" decoding="async"></div>
        <div class="media grade c-b"><img src="media/img/argus-argus-on-water-dscf6237-1600.webp" srcset="media/img/argus-argus-on-water-dscf6237-800.webp 800w, media/img/argus-argus-on-water-dscf6237-1600.webp 1600w, media/img/argus-argus-on-water-dscf6237-2400.webp 2400w" sizes="(max-width: 860px) 50vw, 26vw" alt="Argus on the water" width="7728" height="5152" loading="lazy" decoding="async"></div>
        
      </div>
    </section>
  </div>

  <!-- ============ The four tasks (3D course) ============ -->
  <section class="stage stage-course" id="tasks" data-stage="course" aria-label="The four tasks">
    <div class="stage-sticky">
      <div class="win-box" aria-hidden="true"></div>
      <div class="wrap course-copy">
        <p class="eyebrow">On the water</p>
        <h2 class="h2">The four tasks.</h2>
        <p class="lead">The boats sail a course in the harbour and get one task at a time. The team is not allowed to steer.</p>
      </div>
      <div class="wrap course-foot">
        <ol class="route course-tasks is-in"><li data-task style="--i:0"><span class="route-mark"></span><span class="route-label">Task 01</span><h3 class="h4">Manoeuvring</h3><p class="small">The boat has to steer through a marked course on the water and show that it can control its own movement.</p></li><li data-task style="--i:1"><span class="route-mark"></span><span class="route-label">Task 02</span><h3 class="h4">Path finding</h3><p class="small">The boat has to read the sea markers and find its own way through the course, without help from the team.</p></li><li data-task style="--i:2"><span class="route-mark"></span><span class="route-label">Task 03</span><h3 class="h4">Collision avoidance</h3><p class="small">Another vessel crosses the path. The boat has to see it in time and go around it safely.</p></li><li data-task style="--i:3"><span class="route-mark"></span><span class="route-label">Task 04</span><h3 class="h4">Docking</h3><p class="small">The last task is to find the right spot at the dock and park the boat there on its own.</p></li></ol>
      </div>
    </div>
  </section>

  <div class="wrap">
    <!-- ============ Facts ============ -->
    <section class="sec">
      <div class="sec-head" data-reveal>
        <h2 class="h2">What is out on the course.</h2>
        <p class="lead">The course has the same kind of marks a boat meets at sea, and the boat has to read them.</p>
      </div>
      <div class="items sec-body" data-reveal><div class="item"><b>01</b><div><h3 class="h4">Buoys</h3><p class="small">Floating markers that show where the course goes and where the boat must not sail.</p></div></div><div class="item"><b>02</b><div><h3 class="h4">Cardinal marks</h3><p class="small">Sea marks that show which side is safe to pass.</p></div></div><div class="item"><b>03</b><div><h3 class="h4">AR tags</h3><p class="small">Printed markers the boat reads with its camera to find the right dock or gate.</p></div></div><div class="item"><b>04</b><div><h3 class="h4">The Otter</h3><p class="small">A small vessel from the organisers that moves across the course in the collision task.</p></div></div></div>
    </section>

    <!-- ============ Judging ============ -->
    <section class="sec">
      <div class="sec-head" data-reveal>
        <h2 class="h2">How the teams are judged.</h2>
        <p class="lead">The jury also gives points for the report, the presentation and the inspection.</p>
      </div>

        <h1 class="h1 comp-title"><span class="line-mask"><span style="--d:.1s">RoboBoat</span></span></h1>
        <p class="lead rise" style="--d:.3s">An international student competition in Florida. Teams build small autonomous boats and let them solve a course on the water, with no one steering.</p>
        <ul class="chips rise" style="--d:.35s"><li class="tag">Sarasota, Florida</li><li class="tag">Every February</li><li class="tag">Run by RoboNation</li></ul>
        <div class="btns rise" style="--d:.4s">
          <a class="btn btn-light is-out" href="https://roboboat.org/programs/2026/" target="_blank" rel="noopener noreferrer"><span>RoboBoat 2026</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M7 17 17 7M9 7h8v8"/></svg></a>
          <a class="btn btn-line" href="#page-projects-argus"><span>Meet Argus</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M4 12h15M13 6l6 6-6 6"/></svg></a>
        </div>
      </div>
    </section>

    <!-- ============ Numbers ============ -->
    <section class="sec-tight">
      <div class="stats" data-reveal><div class="stat"><b>19<small>th</small></b><span>RoboBoat competition was held in 2026</span></div><div class="stat"><b>6<small> days</small></b><span>in February at Nathan Benderson Park in Florida</span></div><div class="stat"><b>25<small>+</small></b><span>student teams from many countries took part in 2026</span></div><div class="stat"><b>3</b><span>members is the smallest team allowed to sign up</span></div></div>
    </section>

    <!-- ============ What it is ============ -->
    <section class="sec split">
      <div>
        <div class="sec-head" data-reveal>
          <p class="eyebrow">What it is</p>
          <h2 class="h2">What RoboBoat is.</h2>
        </div>
        <div class="prose" data-reveal><p>RoboBoat is run by RoboNation in the USA. Student teams from all over the world design, build and test their own autonomous surface vessel, and then bring it to Florida.</p><p>The tasks are based on work boats do at sea, like watching a coastline or keeping a port safe. The boats are judged on how they move, how they are built and what they carry on board.</p><p>RoboBoat 2026 was the 19th competition. It was held from 19 to 24 February at Nathan Benderson Park in Sarasota, Florida.</p></div>
      </div>
      <div class="collage" data-reveal="self">
        <div class="media grade c-a hud"><img src="media/img/competitions-roboboat-course-lake-800.webp" srcset="media/img/competitions-roboboat-course-lake-800.webp 800w" sizes="(max-width: 860px) 90vw, 44vw" alt="The RoboBoat course on the lake" width="1260" height="802" loading="lazy" decoding="async"></div>
        <div class="media grade c-b"><img src="media/img/competitions-roboboat-team-boat-at-pontoon-800.webp" srcset="media/img/competitions-roboboat-team-boat-at-pontoon-800.webp 800w" sizes="(max-width: 860px) 50vw, 26vw" alt="A team boat at the pontoon" width="1372" height="716" loading="lazy" decoding="async"></div>
        
      </div>
    </section>
  </div>

  <div class="wrap">
    <!-- ============ How it works ============ -->
    <section class="sec">
      <div class="sec-head" data-reveal>
        <p class="eyebrow">How it works</p>
        <h2 class="h2">A year of work, then a week in Florida.</h2>
        <p class="lead">Teams work on their boats for most of the year before the competition week.</p>
      </div>
      <ol class="route sec-body"><li style="--i:0"><span class="route-mark"></span><span class="route-label">Task 01</span><h3 class="h4">Build a boat</h3><p class="small">Teams read the rules and then design, build and test their own small autonomous boat during the year.</p></li><li style="--i:1"><span class="route-mark"></span><span class="route-label">Task 02</span><h3 class="h4">Sail the course</h3><p class="small">In Florida the boat has to run a set course on its own. The team is not allowed to steer it.</p></li><li style="--i:2"><span class="route-mark"></span><span class="route-label">Task 03</span><h3 class="h4">Show the work</h3><p class="small">Every team hands in a technical report and a video, and presents the boat to the judges.</p></li><li style="--i:3"><span class="route-mark"></span><span class="route-label">Task 04</span><h3 class="h4">Collect points</h3><p class="small">Points come from the course, the design and the documents. The team with the most points wins.</p></li></ol>
    </section>
  </div>

  <div class="wrap">
    <!-- ============ Facts ============ -->
    <section class="sec">
      <div class="sec-head" data-reveal>
        <h2 class="h2">Good to know.</h2>
        <p class="lead">The short version of where, when and who can take part.</p>
      </div>
      <div class="items sec-body" data-reveal><div class="item"><b>01</b><div><h3 class="h4">Where</h3><p class="small">Nathan Benderson Park in Sarasota, Florida.</p></div></div><div class="item"><b>02</b><div><h3 class="h4">When</h3><p class="small">Every February. In 2026 it ran from the 19th to the 24th.</p></div></div><div class="item"><b>03</b><div><h3 class="h4">Who can join</h3><p class="small">High school and college teams, with at least three members.</p></div></div><div class="item"><b>04</b><div><h3 class="h4">Who runs it</h3><p class="small">RoboNation, who also run RoboSub and RobotX.</p></div></div></div>
    </section>

    <!-- ============ Judging ============ -->
    <section class="sec">
      <div class="sec-head" data-reveal>
        <h2 class="h2">What the judges look at.</h2>
        <p class="lead">The judges also give points for the report, the video and the presentation.</p>
      </div>
      <div class="items is-3 sec-body" data-reveal><div class="item"><b>01</b><div><h3 class="h4">Course runs</h3><p class="small">How well the boat solves the tasks on the water, all on its own.</p></div></div><div class="item"><b>02</b><div><h3 class="h4">Technical design report</h3><p class="small">A written report about the boat and the choices behind it.</p></div></div><div class="item"><b>03</b><div><h3 class="h4">Team video</h3><p class="small">A short film where the team introduces itself and the boat.</p></div></div><div class="item"><b>04</b><div><h3 class="h4">Presentation</h3><p class="small">The team presents the design to a panel of judges.</p></div></div><div class="item"><b>05</b><div><h3 class="h4">Systems assessment</h3><p class="small">The boat is checked against the rules before it may sail.</p></div></div><div class="item"><b>06</b><div><h3 class="h4">Community work</h3><p class="small">Teams can also hand in what they do for their local community.</p></div></div></div>
    </section>

    <!-- ============ Marinor and the competition ============ -->
    <section class="sec split is-flip">
      <div class="media grade hud comp-marinor" data-reveal="self"><img src="media/img/argus-argus-in-water-front-dscf6216-1600.webp" srcset="media/img/argus-argus-in-water-front-dscf6216-800.webp 800w, media/img/argus-argus-in-water-front-dscf6216-1600.webp 1600w, media/img/argus-argus-in-water-front-dscf6216-2400.webp 2400w" sizes="(max-width: 860px) 100vw, 50vw" alt="Argus in the water" width="7728" height="5152" loading="lazy" decoding="async"></div>
      <div>
        <div class="sec-head" data-reveal>
          <p class="eyebrow">Marinor and RoboBoat</p>
          <h2 class="h2">Why RoboBoat.</h2>
        </div>
        <div class="prose" data-reveal><p>RoboBoat is one of the biggest competitions for autonomous boats in the world. Teams we meet at Njord sail here too, for example Navier USN from Norway and AGH Solar Boat from Poland. The skills are the same ones we build with Argus: find the way, see what is around the boat, and dock on your own.</p></div>
      </div>
    </section>

    <!-- ============ Links ============ -->
    <section class="sec">
      <div class="sec-head" data-reveal>
        <p class="eyebrow">Links</p>
        <h2 class="h2">Follow RoboBoat online.</h2>
        <p class="lead">Dates, rules, teams and results are on RoboBoat's own website.</p>
      </div>
      <div class="links-grid sec-body" data-reveal><a class="lcard is-big" href="https://roboboat.org/programs/2026/" target="_blank" rel="noopener noreferrer"><div class="lcard-top"><span class="lcard-host">roboboat.org</span><span class="lcard-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M7 17 17 7M9 7h8v8"/></svg></span></div><div><h3 class="lcard-title">RoboBoat 2026</h3><p>The official page for this year's competition, with dates, rules, resources and all the teams.</p></div></a><a class="lcard" href="https://roboboat.org/2026/results" target="_blank" rel="noopener noreferrer"><div class="lcard-top"><span class="lcard-host">roboboat.org</span><span class="lcard-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M7 17 17 7M9 7h8v8"/></svg></span></div><div><h3 class="lcard-title">Results 2026</h3><p>The final standings and awards from RoboBoat 2026.</p></div></a><a class="lcard" href="https://robonation.gitbook.io/roboboat-resources" target="_blank" rel="noopener noreferrer"><div class="lcard-top"><span class="lcard-host">robonation.gitbook.io</span><span class="lcard-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M7 17 17 7M9 7h8v8"/></svg></span></div><div><h3 class="lcard-title">Team handbook</h3><p>The rules and guides every team works from during the year.</p></div></a><a class="lcard" href="https://roboboat.org/" target="_blank" rel="noopener noreferrer"><div class="lcard-top"><span class="lcard-host">roboboat.org</span><span class="lcard-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M7 17 17 7M9 7h8v8"/></svg></span></div><div><h3 class="lcard-title">roboboat.org</h3><p>RoboBoat's main website, run by RoboNation.</p></div></a></div>
    </section>

    <!-- ============ CTA ============ -->
    <section class="sec">
      <div class="cta contours" data-reveal>
        <p class="eyebrow">RoboBoat</p>
        <h2 class="h2">Want to know more about RoboBoat?</h2>
        <p class="lead">The rules, dates and team lists are on RoboBoat's website. You can also read about Njord, the competition we sail in.</p>
        <div class="btns">
          <a class="btn btn-light is-out" href="https://roboboat.org/programs/2026/" target="_blank" rel="noopener noreferrer"><span>Go to RoboBoat 2026</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M7 17 17 7M9 7h8v8"/></svg></a>

        </div>
      </div>
    </section>
  </div>

        <h1 class="h1"><span class="line-mask"><span style="--d:.05s">Join <em>Marinor.</em></span></span></h1>
        <p class="lead rise" style="--d:.25s">We build autonomous boats in Trondheim. All NTNU students can apply, and you do not need to know anything about boats.</p>

      <ol class="rows has-tags sec-body" data-reveal>
          <li class="row"><span class="row-no">01</span><h3 class="row-title">Perception</h3><p>LiDAR, cameras and the software that lets the boat understand what is around it.</p><ul class="row-tags"><li>Sensors</li><li>Computer vision</li><li>Data</li></ul></li>
          <li class="row"><span class="row-no">02</span><h3 class="row-title">Autonomy</h3><p>Planning and decision making, so the boat finds a safe route on its own.</p><ul class="row-tags"><li>Path planning</li><li>Algorithms</li><li>Simulation</li></ul></li>
          <li class="row"><span class="row-no">03</span><h3 class="row-title">Control</h3><p>Steering and thrust. Keeps the boat on the planned path in wind and waves.</p><ul class="row-tags"><li>Control theory</li><li>Modelling</li><li>Testing</li></ul></li>
          <li class="row"><span class="row-no">04</span><h3 class="row-title">GUI</h3><p>The interface where we follow the boat, read its data and send it commands.</p><ul class="row-tags"><li>Web</li><li>UX</li><li>Visualisation</li></ul></li>
          <li class="row"><span class="row-no">05</span><h3 class="row-title">Hardware</h3><p>Hulls, frame, power and electronics.</p><ul class="row-tags"><li>Electronics</li><li>CAD</li><li>Building</li></ul></li>
          <li class="row"><span class="row-no">06</span><h3 class="row-title">Economy</h3><p>Budget, sponsors, travel and other practical work.</p><ul class="row-tags"><li>Budget</li><li>Sponsors</li><li>Applications</li></ul></li>
          <li class="row"><span class="row-no">07</span><h3 class="row-title">PR</h3><p>Social media, photos and this website.</p><ul class="row-tags"><li>Content</li><li>Design</li><li>Web</li></ul></li>
      </ol>
    </section>
